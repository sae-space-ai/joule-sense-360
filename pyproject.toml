[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joule-sense-360"
version = "0.1.0"
description = "Research scaffold for JOULE SENSE 360"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "opencv-python-headless==5.0.0.93"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
